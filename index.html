<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>🔗 klt.my.id — Pemendek URL</title>
<meta name="description" content="Pemendek URL cepat dan aman." />
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    background: radial-gradient(circle at 30% 20%, #1e293b, #0f172a 70%);
    color: #e2e8f0;
    display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card {
    width: 100%; max-width: 560px;
    background: #1e293b;
    border: 1px solid #334155;
    border-radius: 16px;
    padding: 32px;
    box-shadow: 0 20px 60px rgba(0,0,0,.4);
  }
  h1 { margin: 0 0 4px; font-size: 1.5rem; }
  .sub { color: #94a3b8; font-size: .9rem; margin-bottom: 24px; }
  .sub b { color: #a5b4fc; }
  input {
    width: 100%; padding: 14px 16px;
    font-size: 1rem; font-family: inherit;
    color: #e2e8f0; background: #0f172a;
    border: 1px solid #334155; border-radius: 10px;
    outline: none; transition: border-color .2s;
  }
  input:focus { border-color: #6366f1; }
  button {
    width: 100%; margin-top: 12px; padding: 14px;
    font-size: 1rem; font-weight: 600; font-family: inherit;
    color: #fff; background: linear-gradient(135deg, #6366f1, #8b5cf6);
    border: none; border-radius: 10px; cursor: pointer;
    transition: opacity .2s, transform .1s;
  }
  button:hover { opacity: .9; }
  button:active { transform: scale(.98); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .result {
    margin-top: 20px; padding: 16px;
    background: #0f172a; border: 1px dashed #334155;
    border-radius: 10px; display: none;
  }
  .result.show { display: block; animation: pop .25s ease-out; }
  @keyframes pop {
    from { opacity: 0; transform: translateY(-4px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .result .label {
    font-size: .75rem; text-transform: uppercase;
    letter-spacing: .05em; color: #64748b; margin-bottom: 8px;
  }
  .result a {
    color: #a5b4fc; word-break: break-all;
    text-decoration: none; font-weight: 700; font-size: 1.05rem;
  }
  .result a:hover { text-decoration: underline; }
  .row { display: flex; gap: 8px; margin-top: 10px; }
  .row button {
    margin-top: 0; width: auto; flex: 1;
    padding: 10px 14px; font-size: .85rem;
  }
  .btn-secondary {
    background: #334155 !important;
  }
  .btn-secondary:hover { background: #475569 !important; opacity: 1 !important; }
  .msg { margin-top: 12px; font-size: .85rem; min-height: 1.2em; }
  .msg.err { color: #f87171; }
  .msg.ok  { color: #4ade80; }
  .recent {
    margin-top: 24px; padding-top: 20px;
    border-top: 1px solid #334155;
  }
  .recent h2 {
    font-size: .8rem; text-transform: uppercase;
    letter-spacing: .05em; color: #64748b;
    margin: 0 0 12px; font-weight: 600;
  }
  .recent ul { list-style: none; padding: 0; margin: 0; }
  .recent li {
    display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; font-size: .85rem;
    border-bottom: 1px solid #1e293b;
    gap: 12px;
  }
  .recent li:last-child { border-bottom: none; }
  .recent .code {
    color: #a5b4fc; font-weight: 600; flex-shrink: 0;
    cursor: pointer;
  }
  .recent .code:hover { text-decoration: underline; }
  .recent .target {
    color: #64748b; overflow: hidden;
    text-overflow: ellipsis; white-space: nowrap;
    flex: 1; text-align: right;
  }
  .loading {
    color: #64748b; font-size: .85rem;
    text-align: center; padding: 12px;
  }
</style>
</head>
<body>

<div class="card">
  <h1>🔗 klt.my.id</h1>
  <div class="sub">Pemendek URL — hasil: <b>klt.my.id/xxxx</b></div>

  <input id="urlInput" type="url" placeholder="https://contoh.com/url-panjang" autocomplete="off" />
  <button id="btnShorten">Shorten 🚀</button>

  <div class="msg" id="msg"></div>

  <div class="result" id="result">
    <div class="label">Short URL kamu</div>
    <a id="shortLink" href="#" target="_blank" rel="noopener"></a>
    <div class="row">
      <button class="btn-secondary" id="btnCopy">📋 Copy</button>
      <button class="btn-secondary" id="btnOpen">↗ Buka</button>
    </div>
  </div>

  <div class="recent" id="recentBox" style="display:none">
    <h2>Baru dibuat</h2>
    <ul id="recentList"></ul>
  </div>
</div>

<script>
/* ============================================================
   KONFIG
   ============================================================ */
const BASE   = "https://freecloud.order-rz.my.id";
const PROJ   = "proj_764a1e888470fb4eb1e0";
const KEY    = "fapi_9e114d76a0f6c83f1c5ea1dbf3dec731fd6a83bf";
const PATH   = "links";
const API    = `${BASE}/api/rtdb/${PROJ}/${PATH}`;
const DOMAIN = "klt.my.id";
const USE_REWRITE = true; // true → klt.my.id/xxxx  |  false → klt.my.id/r.html?id=xxxx

/* ============================================================
   HELPER
   ============================================================ */
const $   = id => document.getElementById(id);
const msg = (t, cls="") => { $("msg").textContent = t; $("msg").className = "msg " + cls; };

function genCode() {
  const chars = "abcdefghjkmnpqrstuvwxyz23456789"; // tanpa i,l,o,0,1
  let s = "";
  for (let i = 0; i < 4; i++) s += chars[Math.floor(Math.random() * chars.length)];
  return s;
}

function normalize(u) {
  u = u.trim();
  if (!/^https?:\/\//i.test(u)) u = "https://" + u;
  return u;
}

function isValidUrl(u) {
  try { const p = new URL(u); return p.protocol === "http:" || p.protocol === "https:"; }
  catch { return false; }
}

function shortUrlFor(code) {
  return USE_REWRITE
    ? `https://${DOMAIN}/${code}`
    : `https://${DOMAIN}/r.html?id=${code}`;
}

/* ============================================================
   RTDB OPS
   ============================================================ */
async function codeExists(code) {
  try {
    const res = await fetch(`${API}/${code}?freeapi=${KEY}`);
    if (res.status === 404) return false;
    if (!res.ok) return false;
    const data = await res.json().catch(() => null);
    return data !== null && data !== undefined && data !== "";
  } catch { return false; }
}

async function saveLink(code, url) {
  const res = await fetch(`${API}/${code}?freeapi=${KEY}`, {
    method: "PUT",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ url, created: Date.now(), hits: 0 })
  });
  if (!res.ok) throw new Error("HTTP " + res.status);
}

/* ============================================================
   RECENT LINKS (localStorage)
   ============================================================ */
const RECENT_KEY = "klt_recent";
function getRecent() {
  try { return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); }
  catch { return []; }
}
function addRecent(code, url) {
  const list = getRecent().filter(x => x.code !== code);
  list.unshift({ code, url, ts: Date.now() });
  localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 8)));
  renderRecent();
}
function renderRecent() {
  const list = getRecent();
  if (!list.length) { $("recentBox").style.display = "none"; return; }
  $("recentBox").style.display = "block";

  $("recentList").innerHTML = list.map(x => `
    <li>
      <span class="code" data-code="${x.code}">${DOMAIN}/${x.code}</span>
      <span class="target" title="${x.url}">${x.url}</span>
    </li>
  `).join("");

  // klik → copy
  $("recentList").querySelectorAll(".code").forEach(el => {
    el.addEventListener("click", async () => {
      const url = shortUrlFor(el.dataset.code);
      try {
        await navigator.clipboard.writeText(url);
        msg("Tersalin: " + url, "ok");
      } catch { msg("Gagal copy", "err"); }
    });
  });
}

/* ============================================================
   MAIN
   ============================================================ */
async function shorten() {
  const raw = $("urlInput").value.trim();
  if (!raw) return msg("Masukkan URL dulu.", "err");

  const url = normalize(raw);
  if (!isValidUrl(url)) return msg("URL tidak valid.", "err");

  $("btnShorten").disabled = true;
  msg("Membuat short URL...");

  try {
    let code, tries = 0;
    do {
      code = genCode();
      tries++;
      if (tries > 10) throw new Error("Gagal dapat kode unik, coba lagi");
    } while (await codeExists(code));

    await saveLink(code, url);

    const shortUrl = shortUrlFor(code);
    $("shortLink").href = shortUrl;
    $("shortLink").textContent = shortUrl;
    $("result").classList.add("show");
    msg("Berhasil! ✅", "ok");

    addRecent(code, url);
    $("urlInput").value = "";
  } catch (err) {
    console.error(err);
    msg("Gagal: " + err.message, "err");
  } finally {
    $("btnShorten").disabled = false;
  }
}

/* ============================================================
   EVENT
   ============================================================ */
$("btnShorten").addEventListener("click", shorten);
$("urlInput").addEventListener("keydown", e => { if (e.key === "Enter") shorten(); });

$("btnCopy").addEventListener("click", async () => {
  const text = $("shortLink").textContent;
  try {
    await navigator.clipboard.writeText(text);
    msg("Tersalin ke clipboard 📋", "ok");
  } catch {
    msg("Gagal copy, salin manual ya.", "err");
  }
});

$("btnOpen").addEventListener("click", () => {
  window.open($("shortLink").href, "_blank", "noopener");
});

/* ============================================================
   INIT
   ============================================================ */
renderRecent();
</script>
</body>
</html>
